syntax = "proto3";

package gg.grounds.grpc.player;

option java_multiple_files = true;
option java_package = "gg.grounds.grpc.player";
option java_outer_classname = "PlayerProto";

service PlayerPresenceService {
  rpc TryPlayerLogin (PlayerLoginRequest) returns (PlayerLoginReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (PlayerLogoutReply);
  rpc PlayerHeartbeatBatch (PlayerHeartbeatBatchRequest) returns (PlayerHeartbeatBatchReply);

  // Session lookup. A proxy only knows the players connected to *itself*, so a
  // feature that spans proxies (a private message, a party invite) has to ask
  // the presence service who a name belongs to and whether they are still on.
  rpc GetPlayerSession (GetPlayerSessionRequest) returns (GetPlayerSessionReply);
  rpc ResolvePlayerName (ResolvePlayerNameRequest) returns (ResolvePlayerNameReply);

  // Prefix search for tab-complete. Deliberately NOT "list all online players":
  // clients call this per keystroke, and at 10k players a full list would be
  // both a large response and a table scan. The server caps the result count.
  rpc SuggestPlayerNames (SuggestPlayerNamesRequest) returns (SuggestPlayerNamesReply);

  // Follows a player across backend servers so the session knows where they are.
  rpc UpdatePlayerServer (UpdatePlayerServerRequest) returns (UpdatePlayerServerReply);

  // Turns player ids back into names, for players who are NOT online.
  //
  // The session table is presence: the row is deleted on logout, so a name only exists
  // while the player is connected. Anything that outlives a session — a leaderboard, a
  // match history, a ban list — could therefore only ever show a raw uuid. This reads a
  // separate, never-deleted name index written at every login.
  //
  // Batched on purpose: a leaderboard page needs ten names at once, and ten round-trips
  // to render one screen is not a thing worth building.
  rpc LookupPlayerNames (LookupPlayerNamesRequest) returns (LookupPlayerNamesReply);

  // How many players are on each backend server, network-wide.
  //
  // Velocity can only count the players connected to the proxy asking, so with two
  // proxies in front of one lobby each of them reports half of it. Anything that
  // states a number about the network — /agones, a server selector — has to ask here.
  //
  // An aggregate, not a roster: the reply is one row per occupied backend server, so
  // it stays small at any player count (contrast SuggestPlayerNames above).
  rpc CountPlayersByServer (CountPlayersByServerRequest) returns (CountPlayersByServerReply);

  // How many players are on each proxy, network-wide, and which region each
  // proxy is in.
  //
  // A separate call from CountPlayersByServer rather than another field on its
  // reply: the two group the same players along different axes and no caller
  // wants both. /agones asks which backend servers are busy; /online asks how
  // the network is spread across proxies and regions.
  //
  // Also an aggregate: one row per occupied proxy, so it stays small however
  // many players are online.
  rpc CountPlayersByProxy (CountPlayersByProxyRequest) returns (CountPlayersByProxyReply);

  // A player's chosen interface language, stored against the durable player row
  // (the never-deleted name index), so it survives logout and reconnects. Set by
  // the in-game /lang command; read on join to seed the proxy's cache. Absent is
  // a normal answer — the player has never chosen one, and the client's announced
  // locale is used instead.
  rpc GetPlayerLocale (GetPlayerLocaleRequest) returns (GetPlayerLocaleReply);
  rpc SetPlayerLocale (SetPlayerLocaleRequest) returns (SetPlayerLocaleReply);
}

message PlayerLoginRequest {
  string player_id = 1;
  // The name + proxy the player is logging in on. Empty is tolerated (an older
  // plugin-player build): the session is still created, it just can't be found
  // by name until the player reconnects against a newer proxy.
  string player_name = 2;
  string proxy_id = 3;
  // Which region the proxy is in (`nl-ams1`). Empty from a proxy that does not
  // declare one, and empty is a legitimate answer rather than an error: the
  // session is still created, it just cannot say where the player is.
  //
  // Carried here rather than derived from proxy_id. Proxy ids are pod names,
  // which are unique but say nothing about place, and recovering a region by
  // splitting a string is exactly the coupling this field exists to avoid.
  string region = 4;
}

message PlayerLoginReply {
  LoginStatus status = 1;
  string message = 2;
}

message PlayerLogoutRequest {
  string player_id = 1;
}

message PlayerLogoutReply {
  bool removed = 1;
  string message = 2;
}

message PlayerHeartbeatBatchRequest {
  repeated string player_ids = 1;
}

message PlayerHeartbeatBatchReply {
  int32 updated = 1;
  int32 missing = 2;
  string message = 3;
  // success is true when the request is valid and processed; false for invalid requests or server errors.
  bool success = 4;
}

message PlayerSessionInfo {
  string player_id = 1;
  string player_name = 2;
  // The proxy the player is connected to, and the backend server they are on.
  // Either may be empty: a session created by an older plugin-player carries no
  // proxy, and a player who has not reached a backend yet is on no server.
  string proxy_id = 3;
  string server_name = 4;
  int64 connected_at_millis = 5;
  // Where the proxy is. Empty for a session created before the proxy declared a
  // region, so a reader must treat "unknown" as a normal case rather than an
  // error — sessions outlive a rollout.
  string region = 6;
}

message GetPlayerSessionRequest {
  string player_id = 1;
}

message GetPlayerSessionReply {
  bool found = 1;
  PlayerSessionInfo session = 2;
}

message ResolvePlayerNameRequest {
  // Matched case-insensitively — Minecraft names are unique, casing is not.
  string player_name = 1;
}

message ResolvePlayerNameReply {
  bool found = 1;
  PlayerSessionInfo session = 2;
}

message SuggestPlayerNamesRequest {
  string prefix = 1;
  // Server clamps this to its own maximum; 0 means "use the default".
  int32 limit = 2;
}

message SuggestPlayerNamesReply {
  repeated string player_names = 1;
}

message LookupPlayerNamesRequest {
  repeated string player_ids = 1;
}

message LookupPlayerNamesReply {
  // player id -> last name that player logged in with. A player we have never seen is
  // simply absent, rather than mapped to a placeholder every caller would have to know.
  map<string, string> names = 1;
}

message UpdatePlayerServerRequest {
  string player_id = 1;
  string server_name = 2;
}

message UpdatePlayerServerReply {
  bool updated = 1;
}

message CountPlayersByProxyRequest {}

message ProxyPlayerCount {
  string proxy_id = 1;
  // Empty when the session predates the proxy declaring a region.
  string region = 2;
  int32 players = 3;
}

message CountPlayersByProxyReply {
  // One entry per proxy holding at least one player. A proxy nobody is on is
  // absent rather than zero: an idle proxy is not interesting, and the caller
  // cannot enumerate proxies anyway.
  repeated ProxyPlayerCount proxies = 1;

  // Everyone online network-wide, which equals the sum of `proxies` — every
  // session belongs to exactly one proxy, unlike backend servers where a player
  // may be on none yet.
  int32 total = 2;
}

message CountPlayersByServerRequest {}

message ServerPlayerCount {
  string server_name = 1;
  int32 players = 2;
}

message CountPlayersByServerReply {
  // One entry per backend server that has at least one player on it. A server nobody
  // is on is absent rather than zero — the caller already knows its own server list,
  // and can show the ones it did not hear about as empty.
  repeated ServerPlayerCount servers = 1;

  // Everyone online network-wide. Counts players who have not reached a backend server
  // yet, so it can exceed the sum of `servers`.
  int32 total = 2;
}

message GetPlayerLocaleRequest {
  string player_id = 1;
}

message GetPlayerLocaleReply {
  // BCP-47 / Java locale tag, e.g. "de" or "de-DE". Empty when the player has
  // set no preference — the caller falls back to the client's announced locale.
  string locale = 1;
}

message SetPlayerLocaleRequest {
  string player_id = 1;
  // The language tag to store. An empty value clears the preference.
  string locale = 2;
}

message SetPlayerLocaleReply {
  bool updated = 1;
}

enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_ACCEPTED = 1;
  LOGIN_STATUS_ALREADY_ONLINE = 2;
  LOGIN_STATUS_INVALID_REQUEST = 3;
  LOGIN_STATUS_ERROR = 4;
}
